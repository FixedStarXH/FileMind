[project]
name = "filemind"
version = "0.1.0"
description = "Private study and job-search document workspace with cited AI assistance"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "alembic>=1.17,<2",
    "argon2-cffi>=25.1,<26",
    "email-validator>=2.3,<3",
    "fastapi>=0.127,<0.128",
    "pydantic-settings>=2.12,<3",
    "uvicorn[standard]>=0.38,<1",
    "sqlalchemy[asyncio]>=2.0.45,<2.1",
    "psycopg[binary]>=3.3,<4",
    "python-multipart>=0.0.33,<0.1",
    "redis>=7.1,<8",
    "celery[redis]>=5.6,<5.8",
]

[dependency-groups]
dev = [
    "mypy>=1.19,<2",
    "ruff>=0.14,<1",
]

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/filemind"]

[project.scripts]
filemind = "filemind.cli:main"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
