name: filemind

services:
  api:
    build: .
    env_file:
      - .env
    environment:
      APP_ENV: ${APP_ENV:-development}
      SESSION_SECRET: ${SESSION_SECRET:?set SESSION_SECRET}
      DATABASE_URL: postgresql+psycopg://filemind:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@postgres:5432/filemind
      REDIS_URL: redis://redis:6379/0
      STORAGE_ROOT: /data/files
      MODEL_CACHE_DIR: /data/models
      PREVIEW_ROOT: /data/previews
      APP_ORIGIN: ${APP_ORIGIN:-http://127.0.0.1:5173}
      ENABLE_INGESTION_WORKER: ${ENABLE_INGESTION_WORKER:-false}
    ports:
      - "${API_BIND:-127.0.0.1:8000}:8000"
    volumes:
      - filemind_files:/data/files
      - filemind_models:/data/models:ro
      - filemind_previews:/data/previews:ro
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    restart: unless-stopped

  migrate:
    build: .
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg://filemind:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@postgres:5432/filemind
    command: ["/app/.venv/bin/alembic", "upgrade", "head"]
    depends_on:
      postgres:
        condition: service_healthy

  dispatcher:
    build: .
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg://filemind:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@postgres:5432/filemind
      REDIS_URL: redis://redis:6379/0
      STORAGE_ROOT: /data/files
      MODEL_CACHE_DIR: /data/models
      HF_HOME: /data/models/hf-home
      HF_HUB_CACHE: /data/models/huggingface
      HF_XET_CACHE: /data/models/hf-xet
      HF_HUB_DISABLE_TELEMETRY: "1"
      ENABLE_INGESTION_WORKER: ${ENABLE_INGESTION_WORKER:-false}
    command: ["/app/.venv/bin/python", "-m", "filemind.dispatcher"]
    volumes:
      - filemind_files:/data/files
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    restart: unless-stopped

  worker-maintenance:
    build: .
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg://filemind:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@postgres:5432/filemind
      REDIS_URL: redis://redis:6379/0
      STORAGE_ROOT: /data/files
      MODEL_CACHE_DIR: /data/models
      PREVIEW_ROOT: /data/previews
    command:
      - /app/.venv/bin/celery
      - -A
      - filemind.celery_app:celery_app
      - worker
      - --queues=maintenance
      - --concurrency=1
      - --loglevel=INFO
    volumes:
      - filemind_files:/data/files
      - filemind_previews:/data/previews
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    restart: unless-stopped

  worker-ingestion:
    build:
      context: .
      target: ingestion
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg://filemind:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@postgres:5432/filemind
      REDIS_URL: redis://redis:6379/0
      STORAGE_ROOT: /data/files
      MODEL_CACHE_DIR: /data/models
      PREVIEW_ROOT: /data/previews
      HF_HOME: /data/models/hf-home
      HF_HUB_CACHE: /data/models/huggingface
      HF_XET_CACHE: /data/models/hf-xet
      HF_HUB_DISABLE_TELEMETRY: "1"
    command:
      - /app/.venv/bin/celery
      - -A
      - filemind.celery_app:celery_app
      - worker
      - --queues=ingestion
      - --concurrency=1
      - --loglevel=INFO
    volumes:
      - filemind_files:/data/files:ro
      - filemind_models:/data/models
      - filemind_previews:/data/previews
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp:size=256m,mode=1777
    mem_limit: 3g
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    restart: unless-stopped

  worker-agent:
    build: .
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg://filemind:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@postgres:5432/filemind
      REDIS_URL: redis://redis:6379/0
      STORAGE_ROOT: /data/files
      MODEL_CACHE_DIR: /data/models
      HF_HOME: /data/models/hf-home
      HF_HUB_CACHE: /data/models/huggingface
      HF_XET_CACHE: /data/models/hf-xet
      HF_HUB_DISABLE_TELEMETRY: "1"
      LANGGRAPH_STRICT_MSGPACK: "true"
    command:
      - /app/.venv/bin/celery
      - -A
      - filemind.celery_app:celery_app
      - worker
      - --queues=agent
      - --concurrency=${AGENT_CONCURRENCY:-1}
      - --loglevel=INFO
    volumes:
      - filemind_files:/data/files:ro
      - filemind_models:/data/models:ro
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp:size=128m,mode=1777
    mem_limit: 2g
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    restart: unless-stopped

  postgres:
    image: pgvector/pgvector:0.8.1-pg17
    environment:
      POSTGRES_DB: filemind
      POSTGRES_USER: filemind
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    ports:
      - "${POSTGRES_BIND:-127.0.0.1:5433}:5432"
    volumes:
      - filemind_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U filemind -d filemind"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped

  redis:
    image: redis:7.4.2-alpine
    command: ["redis-server", "--appendonly", "yes", "--save", "60", "1000"]
    ports:
      - "${REDIS_BIND:-127.0.0.1:6380}:6379"
    volumes:
      - filemind_redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped

  web:
    profiles: [production]
    user: "101:101"
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "${WEB_BIND:-127.0.0.1:8080}:8080"
    depends_on:
      api:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:8080/health/live || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 6
    read_only: true
    tmpfs:
      - /var/cache/nginx:size=16m,mode=1777
      - /var/run:size=2m,mode=1777
      - /tmp:size=8m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    restart: unless-stopped

  volume-tools:
    profiles: [ops]
    image: alpine:3.22
    volumes:
      - filemind_files:/data
    entrypoint: ["tar"]

volumes:
  filemind_postgres:
  filemind_redis:
  filemind_files:
  filemind_models:
  filemind_previews:
